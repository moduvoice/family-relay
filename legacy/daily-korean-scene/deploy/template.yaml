AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Daily Korean Scene - MCP server + Alexa+ role simulator on Lambda Function URLs (arm64, Lambda Web Adapter)

Parameters:
  PublicMcpBaseUrl:
    Type: String
    Default: ""
    Description: https URL of the MCP function (no trailing slash). Empty on the first deploy; deploy.sh fills it on the second pass.
  WebAdapterLayerArn:
    Type: String
    Description: AWS Lambda Web Adapter layer for arm64 in this region, e.g. arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:25
  GraderModel:
    Type: String
    Default: "us-east-1|global.anthropic.claude-sonnet-4-6,us-east-1|us.anthropic.claude-sonnet-4-6,us-west-2|global.anthropic.claude-sonnet-4-6,us-west-2|us.anthropic.claude-sonnet-4-6"
  OrchestratorModel:
    Type: String
    Default: "us-east-1|global.anthropic.claude-haiku-4-5-20251001-v1:0,us-east-1|us.anthropic.claude-haiku-4-5-20251001-v1:0,us-west-2|global.anthropic.claude-haiku-4-5-20251001-v1:0,us-west-2|us.anthropic.claude-haiku-4-5-20251001-v1:0"

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 60
    CodeUri: ../build/lambda
    Layers: [!Ref WebAdapterLayerArn]
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
        AWS_LWA_PORT: "8080"
        PYTHONPATH: /var/task
        DKS_STORE: dynamodb
        DKS_DYNAMODB_TABLE: !Ref StateTable
        DKS_SCENES_DIR: /var/task/content/scenes
        DKS_AUDIO_DIR: /var/task/content/audio
        DKS_GRADER_MODEL: !Ref GraderModel
        DKS_ORCHESTRATOR_MODEL: !Ref OrchestratorModel

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: run_mcp.sh
      Environment:
        Variables:
          DKS_MCP_STATELESS: "1"          # no session affinity between Lambda instances
          DKS_MCP_JSON_RESPONSE: "1"
          DKS_DNS_REBINDING_PROTECTION: "0"  # public URL; callers are identified by their bearer token
          DKS_ALLOWED_ORIGINS: "*"
          DKS_PUBLIC_BASE_URL: !Ref PublicMcpBaseUrl
          DKS_DEMO_MODE: "1"
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref StateTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: run_simulator.sh
      Environment:
        Variables:
          DKS_MCP_URL: !Sub "${McpFunctionUrl.FunctionUrl}mcp"
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

Outputs:
  McpUrl:
    Value: !Sub "${McpFunctionUrl.FunctionUrl}mcp"
  McpBaseUrl:
    Value: !GetAtt McpFunctionUrl.FunctionUrl
  SimulatorUrl:
    Value: !GetAtt SimulatorFunctionUrl.FunctionUrl
  StateTableName:
    Value: !Ref StateTable
